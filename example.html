<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gl-lite Example</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #1a1a1a;
      }
      #container {
        text-align: center;
      }
      canvas {
        border: 2px solid #333;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }
      h1 {
        color: #fff;
        font-size: 24px;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <h1>gl-lite Example</h1>
      <canvas id="canvas" width="512" height="512"></canvas>
    </div>

    <script type="module">
      import { GLRenderer } from "./dist/index.js";

      const canvas = document.getElementById("canvas");
      const renderer = new GLRenderer({ canvas });

      // Create a simple animated shader
      const program = renderer.program({
        vert: /* glsl */ `
        precision mediump float;
        attribute vec2 position;
        varying vec2 vUv;
        void main() {
          vUv = position * 0.5 + 0.5;
          gl_Position = vec4(position, 0.0, 1.0);
        }
      `,
        frag: /* glsl */ `
        precision mediump float;
        uniform float time;
        uniform vec2 resolution;
        varying vec2 vUv;
        
        void main() {
          vec2 uv = vUv * 2.0 - 1.0;
          uv.x *= resolution.x / resolution.y;
          
          float d = length(uv);
          float angle = atan(uv.y, uv.x);
          
          float ripple = sin(d * 10.0 - time * 2.0) * 0.5 + 0.5;
          float spin = sin(angle * 5.0 + time) * 0.5 + 0.5;
          
          vec3 color = vec3(
            ripple,
            spin,
            sin(d * 5.0 + time) * 0.5 + 0.5
          );
          
          gl_FragColor = vec4(color, 1.0);
        }
      `,
        uniforms: {
          time: (props) => props.time,
          resolution: [canvas.width, canvas.height],
        },
      });

      // Animation loop
      let time = 0;
      function animate() {
        time += 0.016;

        renderer.clear([0.1, 0.1, 0.15, 1]);
        program.draw({ time });

        requestAnimationFrame(animate);
      }
      animate();
    </script>
  </body>
</html>
